<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Movilance | Enterprise Facility Movement & Vigilance Platform</title>
    <meta name="description" content="Movilance is a unified platform for facility vigilance. Monitor visitors, vehicles, assets, and compliance in real-time with enterprise-grade security.">
    <meta name="theme-color" content="#dc2626">

    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Movilance",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "description": "Unified platform for facility movement, visitor management, and security vigilance.",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "120"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Movilance Inc.",
        "url": "https://movilance.com",
        "logo": "https://movilance.com/logo.png"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              movilance: {
                navy: '#0b1120', // darker slate/navy
                blue: '#1e293b', // slate 800
                red: '#dc2626', // Red 600 - Primary Brand
                redDark: '#b91c1c', // Red 700 - Hover
                light: '#f8fafc', // Slate 50
              }
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
